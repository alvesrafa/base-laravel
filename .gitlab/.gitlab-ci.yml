stages:
  - quality
  - test
  - docker-build
  - deploy

variables:
  COMPOSER_ALLOW_SUPERUSER: 1
  AKS_PATH: "./.gitlab/"
  AKS_CLUSTER_NAME: "default-cluster-name"
  AKS_RESOURCE_GROUP: "default-resource-group"
  ENV: "default-env"
  AZURE_ACR_NAME: "default-acr"
  DOCKERFILE_PATH: "./docker"

# Define when pipelines should run
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "development" || $CI_COMMIT_BRANCH == "homolog" || $CI_COMMIT_BRANCH == "production")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "development" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "homolog")'
    - when: never


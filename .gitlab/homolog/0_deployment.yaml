apiVersion: apps/v1
kind: Deployment
metadata:
  name: APP-NAME-deployment
  namespace: APP-NAMESPACE-HML
spec:
  replicas: 1
  selector:
    matchLabels:
      app: APP-NAME
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: APP-NAME
    spec:
      containers:
        - name: APP-NAME
          image: IMAGE_VERSION
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            limits:
              cpu: 1000m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1536Mi
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/lifecycle
                    operator: In
                    values:
                      - spot
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - APP-NAME
                topologyKey: kubernetes.io/hostname
              weight: 99
